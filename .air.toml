root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/app ./cmd/app"
bin = "./tmp/app"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "web", "migrations", "docs", "deployments", "test"]
exclude_regex = ["_test\\.go", "mock_.*\\.go"]
delay = 300
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
