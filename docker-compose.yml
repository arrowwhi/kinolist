name: kinolist

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["infra", "full"]
    environment:
      POSTGRES_USER: kinolist
      POSTGRES_PASSWORD: kinolist
      POSTGRES_DB: kinolist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinolist -d kinolist"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Миграции накатывает отдельный контейнер: приложение не должно уметь
  # менять схему, а при нескольких репликах это ещё и гонка.
  migrate:
    image: ghcr.io/kukymbr/goose-docker:3.25.0
    profiles: ["infra", "full"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://kinolist:kinolist@postgres:5432/kinolist?sslmode=disable
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    profiles: ["full"]
    env_file: .env
    environment:
      POSTGRES_DSN: postgres://kinolist:kinolist@postgres:5432/kinolist?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/app", "-version"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
