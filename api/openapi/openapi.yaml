openapi: 3.1.0

info:
  title: kinolist API
  version: 1.0.0
  description: |
    API телеграм-мини-приложения для коллекции фильмов.

    Авторизация — подпись Telegram Mini App `initData` в заголовке
    `X-Telegram-Init-Data` (или `Authorization: tma <initData>`).
    Пользователь заводится автоматически при первом обращении.

servers:
  - url: /api/v1

security:
  - telegramInitData: []

paths:
  /me:
    get:
      summary: Текущий пользователь
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /statistics:
    get:
      summary: Общая статистика коллекции для главной страницы
      description: |
        Все фильмы и сериалы текущего пользователя, без фильтров и поиска.
        Сериал считается одной записью независимо от числа сезонов.
        total_count = want_to_watch_count + watched_count.
        Пустая коллекция возвращает нули. Параметры запроса не учитываются.
      responses:
        '200':
          description: Счётчики всей коллекции
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /directors:
    get:
      summary: Режиссёры в коллекции текущего пользователя
      description: |
        Только сохранённые работы пользователя. Средняя личная оценка включает
        только просмотренные работы с оценкой; сериал считается одной работой.
        Поиск по имени не меняет счётчики внутри карточки. Тип контента меняет их.
      parameters:
        - name: q
          in: query
          description: Подстрока имени или оригинального имени без учёта регистра
          schema: { type: string }
        - name: media_type
          in: query
          schema: { type: string, enum: [movie, tv] }
        - name: sort
          in: query
          schema: { type: string, enum: [name, work_count, average_user_rating], default: name }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Страница режиссёров; total учитывает поиск и тип, но не пагинацию
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /directors/{id}:
    get:
      summary: Режиссёр и личная статистика его работ
      description: |
        404, если у пользователя нет работ этого режиссёра. При выборе типа,
        для которого работ нет, возвращаются нулевые счётчики и средняя null.
        Работы загружаются через GET /movies?director_ids={id}.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: media_type
          in: query
          schema: { type: string, enum: [movie, tv] }
      responses:
        '200':
          description: Режиссёр из коллекции
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /my-directors:
    get:
      summary: Мои режиссёры — отслеживаемые и из коллекции
      description: |
        В выборку попадают режиссёры, на которых подписан пользователь, и
        режиссёры работ из его коллекции. Счётчики объединяют фильмографию из
        каталога (TMDB) с работами коллекции, которых в каталоге нет.
        Пока фильмография не загружена, filmography_complete=false и
        work_count считает только работы коллекции. counts учитывают query,
        но не scope.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [all, followed, collection], default: all }
          description: collection — режиссёры из коллекции без подписки
        - name: query
          in: query
          description: Поиск по русскому и оригинальному имени
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name, progress, user_rating], default: name }
        - name: order
          in: query
          description: По умолчанию asc для name и desc для остальных
          schema: { type: string, enum: [asc, desc] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorOverviewList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /people/search:
    get:
      summary: Поиск людей в каталоге TMDB
      description: |
        Люди нужной роли идут первыми (role=director — known_for_department
        Directing, role=actor — Acting), остальные не отбрасываются. id и
        followed относятся к справочнику этой роли: id заполнен, только если
        человек уже заведён как режиссёр (или актёр при role=actor). Пустой
        query возвращает подсказки — людей этой роли из коллекции без подписки
        (без запроса в TMDB). Ничего не записывает в базу.
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: role
          in: query
          description: Для какого раздела ищем; по умолчанию director (как раньше)
          schema: { type: string, enum: [director, actor], default: director }
      responses:
        '200':
          description: До 20 человек
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PersonSearchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /directors/import:
    post:
      summary: Завести человека из TMDB как режиссёра
      description: |
        Идемпотентно: загружает профиль и фильмографию, уточняет русское имя
        через Кинопоиск. Нужен, чтобы открыть профиль человека из поиска.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TMDBPersonRequest' }
      responses:
        '200':
          description: Режиссёр с внутренним id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /directors/follow-by-tmdb:
    post:
      summary: Завести человека из TMDB и подписаться на него
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TMDBPersonRequest' }
      responses:
        '200':
          description: Режиссёр, followed=true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /directors/{id}/profile:
    get:
      summary: Профиль режиссёра и полная фильмография
      description: |
        Если снимок фильмографии старше DIRECTOR_WORKS_TTL, он обновляется в
        рамках запроса (до 5 секунд). Если каталог не ответил — отдаётся
        сохранённый снимок со stale=true. Фильмография отсортирована от новых
        работ к старым; фильтры и другие сортировки делает клиент.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /directors/{id}/follow:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      summary: Подписаться на режиссёра (идемпотентно)
      responses:
        '204': { description: Подписка есть }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Отписаться от режиссёра
      description: Режиссёр с работами в коллекции остаётся в scope=collection.
      responses:
        '204': { description: Подписки нет }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /my-actors:
    get:
      summary: Мои актёры — отслеживаемые и из коллекции
      description: |
        Экран «30 · Мои актёры». Как /my-directors, но «из коллекции» —
        только актёры, сыгравшие в двух и более работах коллекции пользователя
        (в пределах сохранённого топа актёрского состава работы). Иначе каждая
        работа приносила бы десяток людей. Счётчики объединяют фильмографию из
        каталога с работами коллекции, которых в каталоге нет. counts учитывают
        query, но не scope.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [all, followed, collection], default: all }
          description: collection — актёры из коллекции без подписки
        - name: query
          in: query
          description: Поиск по русскому и оригинальному имени
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name, progress, user_rating], default: name }
        - name: order
          in: query
          description: По умолчанию asc для name и desc для остальных
          schema: { type: string, enum: [asc, desc] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActorOverviewList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /actors/import:
    post:
      summary: Завести человека из TMDB как актёра
      description: |
        Идемпотентно: загружает профиль и фильмографию ролей, уточняет русское
        имя через Кинопоиск. Нужен, чтобы открыть профиль человека из поиска
        («32 · Добавить актёра») или из блока «В ролях» карточки, если у
        участника состава ещё нет внутреннего id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TMDBPersonRequest' }
      responses:
        '200':
          description: Актёр с внутренним id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActorOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /actors/follow-by-tmdb:
    post:
      summary: Завести человека из TMDB как актёра и подписаться
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TMDBPersonRequest' }
      responses:
        '200':
          description: Актёр, followed=true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActorOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /actors/{id}/profile:
    get:
      summary: Профиль актёра и все его роли
      description: |
        Экран «31 · Профиль актёра». Правила свежести снимка те же, что у
        режиссёра (ACTOR_WORKS_TTL, обновление в запросе до 5 секунд, stale=true
        при недоступном каталоге). Роли отсортированы от новых к старым;
        фильтры и другие сортировки делает клиент.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActorProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /actors/{id}/follow:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      summary: Подписаться на актёра (идемпотентно)
      responses:
        '204': { description: Подписка есть }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Отписаться от актёра
      description: Актёр с двумя и более работами в коллекции остаётся в scope=collection.
      responses:
        '204': { description: Подписки нет }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /genres:
    get:
      summary: Справочник жанров или сводка коллекции
      parameters:
        - $ref: '#/components/parameters/DirectorIDs'
        - name: media_type
          in: query
          description: Фильтр счётчиков при scope=collection
          schema: { type: string, enum: [movie, tv] }
        - name: scope
          in: query
          description: collection возвращает только жанры пользователя со счётчиками статусов
          schema: { type: string, enum: [collection] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      anyOf:
                        - { $ref: '#/components/schemas/Genre' }
                        - { $ref: '#/components/schemas/GenreStats' }

  /movies:
    get:
      summary: Коллекция пользователя
      parameters:
        - $ref: '#/components/parameters/DirectorIDs'
        - name: media_type
          in: query
          description: Тип контента; отсутствие означает фильмы и сериалы вместе
          schema: { type: string, enum: [movie, tv] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/Status' }
        - name: genre_ids
          in: query
          description: Идентификаторы жанров через запятую
          schema: { type: string, example: "15,18" }
        - name: q
          in: query
          description: Поиск по названию и оригинальному названию
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [added_at, title, year, rating, user_rating, watched_at]
            default: added_at
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovieList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Добавить работу в коллекцию по внешнему id
      description: |
        Быстрое добавление из фильмографии режиссёра и карточки каталога, без
        поиска и задачи. Статус по умолчанию want_to_watch. «Уже смотрел» —
        status=watched с необязательными user_rating и review; правила проверки
        те же, что у POST /jobs/{id}/confirm. Дубль — 409 с existing_user_movie_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, external_id, media_type]
              properties:
                provider: { type: string, enum: [tmdb, kinopoisk] }
                external_id: { type: integer, format: int32, minimum: 1 }
                media_type: { type: string, enum: [movie, tv] }
                status: { $ref: '#/components/schemas/Status' }
                user_rating:
                  type: integer
                  minimum: 0
                  maximum: 10
                  default: 0
                  description: 0 или отсутствие — без оценки; иначе 1–10
                review: { type: string, maxLength: 5000 }
      responses:
        '201':
          description: Добавлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMovie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Уже в коллекции
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /catalog/{provider}/{media_type}/{external_id}:
    get:
      summary: Карточка работы прямо из каталога
      description: |
        Подробности работы по внешнему id — для фильмографии режиссёра, где
        работы может не быть в коллекции. Данные берутся тем же путём, что и при
        добавлении (TMDB с кэшем catalog_cache; kinopoisk — только если настроен
        запасной каталог, иначе 502). id равен 0, если работы нет в общем
        справочнике; user_movie_id/status/user_rating есть, только если работа
        уже в коллекции текущего пользователя. upcoming считается по правилу
        фильмографии: дата выхода в будущем, а без даты — год позже текущего или
        неизвестен; для работы из коллекции всегда false.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [tmdb, kinopoisk] } }
        - { name: media_type, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: external_id, in: path, required: true, schema: { type: integer, format: int32, minimum: 1 } }
      responses:
        '200':
          description: Карточка работы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogMovie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /movies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Карточка фильма из коллекции
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMovie' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Изменить статус, оценку, заметку или отзыв
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMovieRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMovie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Удалить фильм из коллекции
      responses:
        '204': { description: Удалён }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs:
    post:
      summary: Начать поиск фильма
      description: |
        Принимает ссылку на рилс Instagram или название фильма — сервис сам
        определяет тип. Отвечает сразу: поиск выполняется фоновым воркером,
        клиент опрашивает `GET /jobs/{id}` до статуса `confirming` или `failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobRequest' }
      responses:
        '202':
          description: Задача принята
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: Разбор ссылок недоступен — доступен только ввод названия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Состояние задачи и найденные кандидаты
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/candidates/{provider}/{media_type}/{external_id}:
    get:
      summary: Подробности кандидата из задачи текущего пользователя
      description: Доступен только для кандидата из задачи в статусе confirming. ID фильма в ответе равен 0 до сохранения. Подробности кэшируются на 15 минут.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [tmdb, kinopoisk] } }
        - { name: media_type, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: external_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Подробности выбранного кандидата
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Задача уже завершена }
        '502': { description: Каталог недоступен }

  /jobs/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: Подтвердить выбранный фильм
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmJobRequest' }
      responses:
        '201':
          description: Фильм добавлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMovie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Фильм уже в коллекции
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /jobs/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: Отменить задачу
      responses:
        '204': { description: Отменена }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    telegramInitData:
      type: apiKey
      in: header
      name: X-Telegram-Init-Data

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Недействительная подпись Telegram
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: Внешний каталог недоступен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    DirectorIDs:
      name: director_ids
      in: query
      description: |
        Внутренние ID через запятую (до 200). OR между режиссёрами, AND с
        жанрами и типом. Для /genres применяется только при scope=collection.
        Каждая работа учитывается один раз, даже если выбраны два её режиссёра.
      schema: { type: string, example: "17,25" }

  schemas:
    DirectorOverview:
      type: object
      required: [id, name, original_name, known_for, followed, filmography_complete, work_count, in_collection_count, watched_count, want_to_watch_count, rated_count, average_user_rating]
      properties:
        id: { type: integer, format: int64 }
        tmdb_id: { type: integer, format: int32 }
        kinopoisk_id: { type: integer, format: int32 }
        name: { type: string, description: Русское имя, если удалось найти }
        original_name: { type: string }
        photo_url: { type: string, format: uri }
        birth_date: { type: string, format: date }
        death_date: { type: string, format: date }
        place_of_birth: { type: string }
        known_for:
          type: array
          description: До трёх самых высокооценённых работ
          items: { type: string }
        followed: { type: boolean }
        filmography_complete:
          type: boolean
          description: false — фильмография из каталога ещё не загружена
        work_count: { type: integer }
        in_collection_count: { type: integer }
        watched_count: { type: integer }
        want_to_watch_count: { type: integer }
        rated_count: { type: integer }
        average_user_rating: { type: number, nullable: true }
    DirectorOverviewList:
      type: object
      required: [items, total, limit, offset, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DirectorOverview' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        counts:
          type: object
          required: [all, followed, collection]
          properties:
            all: { type: integer }
            followed: { type: integer }
            collection: { type: integer }
    FilmographyItem:
      type: object
      required: [media_type, title, original_title, rating, vote_count, upcoming]
      properties:
        tmdb_id: { type: integer, format: int32, description: Нет у работ только из Кинопоиска }
        movie_id: { type: integer, format: int64 }
        media_type: { type: string, enum: [movie, tv] }
        title: { type: string }
        original_title: { type: string }
        year: { type: integer }
        release_date: { type: string, format: date }
        poster_url: { type: string, format: uri }
        rating:
          type: number
          nullable: true
          description: Рейтинг TMDB; null при менее чем 20 голосах
        vote_count: { type: integer }
        episode_count: { type: integer, description: Эпизоды, снятые режиссёром }
        upcoming: { type: boolean }
        user_movie_id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/Status' }
        user_rating: { type: integer, minimum: 1, maximum: 10 }
    DirectorProfile:
      allOf:
        - $ref: '#/components/schemas/DirectorOverview'
        - type: object
          required: [biography, stale, filmography]
          properties:
            biography: { type: string }
            biography_lang: { type: string, enum: [ru, en] }
            stale: { type: boolean }
            filmography:
              type: array
              items: { $ref: '#/components/schemas/FilmographyItem' }
    ActorOverview:
      description: |
        Поля и правила подсчёта как у DirectorOverview; work_count и прочие
        счётчики считаются по ролям (одна работа — одна роль, даже если
        персонажей несколько). known_for — до трёх самых популярных ролей.
      allOf:
        - $ref: '#/components/schemas/DirectorOverview'
    ActorOverviewList:
      type: object
      required: [items, total, limit, offset, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActorOverview' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        counts:
          type: object
          required: [all, followed, collection]
          properties:
            all: { type: integer }
            followed: { type: integer }
            collection: { type: integer }
    ActorFilmographyItem:
      description: |
        Строка «Роли» в профиле актёра. Как FilmographyItem, плюс персонаж.
        episode_count — эпизоды, в которых снимался актёр.
      allOf:
        - $ref: '#/components/schemas/FilmographyItem'
        - type: object
          required: [character]
          properties:
            character:
              type: string
              description: Персонаж; несколько — через « / »; пустая строка, если неизвестен
    ActorProfile:
      allOf:
        - $ref: '#/components/schemas/ActorOverview'
        - type: object
          required: [biography, stale, filmography]
          properties:
            biography: { type: string }
            biography_lang: { type: string, enum: [ru, en] }
            stale: { type: boolean }
            filmography:
              type: array
              items: { $ref: '#/components/schemas/ActorFilmographyItem' }
    CastMember:
      type: object
      required: [name, original_name, character]
      description: |
        Участник блока «В ролях» карточки. В предпросмотре и карточке каталога
        внутреннего id может не быть — тогда профиль открывается через
        POST /actors/import по tmdb_id.
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        tmdb_id: { type: integer, minimum: 1 }
        kinopoisk_id: { type: integer, minimum: 1 }
        name: { type: string }
        original_name: { type: string }
        character: { type: string, description: Пустая строка, если неизвестен }
        photo_url: { type: string, format: uri }
    PersonSearchResult:
      type: object
      required: [id, tmdb_id, name, original_name, known_for, followed]
      properties:
        id: { type: integer, format: int64, nullable: true }
        tmdb_id: { type: integer, format: int32 }
        name: { type: string }
        original_name: { type: string }
        photo_url: { type: string, format: uri }
        known_for_department: { type: string }
        known_for:
          type: array
          items: { type: string }
        followed: { type: boolean }
    TMDBPersonRequest:
      type: object
      required: [tmdb_id]
      properties:
        tmdb_id: { type: integer, format: int32, minimum: 1 }
    Director:
      type: object
      required: [name, original_name]
      description: В предпросмотре внутреннего id ещё нет; он назначается при сохранении
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        tmdb_id: { type: integer, minimum: 1 }
        kinopoisk_id: { type: integer, minimum: 1 }
        name: { type: string }
        original_name: { type: string }

    DirectorStats:
      allOf:
        - $ref: '#/components/schemas/Director'
        - type: object
          required: [id, total_count, want_to_watch_count, watched_count, rated_count, average_user_rating]
          properties:
            total_count: { type: integer, minimum: 0 }
            want_to_watch_count: { type: integer, minimum: 0 }
            watched_count: { type: integer, minimum: 0 }
            rated_count: { type: integer, minimum: 0 }
            average_user_rating:
              type: [number, 'null']
              description: Средняя личная оценка просмотренных работ, округлённая до десятых; null без оценок

    DirectorList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DirectorStats' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: already_in_collection }
        message: { type: string, example: Фильм уже в коллекции }
        existing_user_movie_id: { type: integer, format: int64, description: ID существующей записи при already_in_collection }

    Status:
      type: string
      enum: [want_to_watch, watched]

    Me:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        first_name: { type: string }

    Genre:
      type: object
      required: [id, name_ru, name_en]
      properties:
        id: { type: integer }
        name_ru: { type: string, example: фантастика }
        name_en: { type: string, example: Science Fiction }

    Movie:
      type: object
      required: [id, title, overview, genres, directors, cast, media_type, season_count]
      properties:
        media_type: { type: string, enum: [movie, tv] }
        season_count:
          type: [integer, 'null']
          minimum: 1
          description: Число обычных сезонов сериала; null для фильма или неизвестного значения
        id: { type: integer, format: int64 }
        tmdb_id: { type: integer }
        kinopoisk_id: { type: integer }
        title: { type: string }
        original_title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster_url: { type: string, format: uri }
        runtime_min: { type: integer }
        rating: { type: number, format: float }
        rating_provider: { type: string, enum: [tmdb, kinopoisk] }
        rating_vote_count: { type: [integer, 'null'], minimum: 0 }
        directors:
          type: array
          description: Все известные режиссёры; пустой массив при отсутствии данных
          items: { $ref: '#/components/schemas/Director' }
        cast:
          type: array
          description: Первые 10 актёров в порядке титров; пустой массив при отсутствии данных
          items: { $ref: '#/components/schemas/CastMember' }
        genres:
          type: array
          items: { $ref: '#/components/schemas/Genre' }

    CatalogMovie:
      allOf:
        - $ref: '#/components/schemas/Movie'
        - type: object
          required: [upcoming]
          properties:
            release_date:
              type: string
              format: date
              description: Дата выхода (у сериала — первого эфира); нет, если каталог её не знает
            upcoming: { type: boolean }
            user_movie_id: { type: integer, format: int64, description: Есть, только если работа в коллекции }
            status: { $ref: '#/components/schemas/Status' }
            user_rating: { type: integer, minimum: 1, maximum: 10 }

    UserMovie:
      type: object
      required: [id, movie, status, source, added_at]
      properties:
        id: { type: integer, format: int64 }
        movie: { $ref: '#/components/schemas/Movie' }
        status: { $ref: '#/components/schemas/Status' }
        user_rating: { type: integer, minimum: 1, maximum: 10 }
        note: { type: string }
        review: { type: string, maxLength: 5000 }
        source: { type: string, enum: [reel, manual] }
        source_url: { type: string }
        added_at: { type: string, format: date-time }
        watched_at: { type: string, format: date-time }

    MovieList:
      type: object
      required: [items, total, limit, offset, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserMovie' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        summary: { $ref: '#/components/schemas/CollectionSummary' }

    UpdateMovieRequest:
      type: object
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/Status' }
        user_rating:
          type: integer
          minimum: 0
          maximum: 10
          description: 0 снимает оценку
        note: { type: string }
        review: { type: string, maxLength: 5000 }

    CreateJobRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          description: Ссылка на рилс Instagram либо название фильма
          example: https://www.instagram.com/reel/Cx1y2Z3aBcD/

    Candidate:
      type: object
      required: [provider, external_id, title, overview, directors, cast, media_type, season_count]
      properties:
        media_type: { type: string, enum: [movie, tv] }
        season_count:
          type: [integer, 'null']
          minimum: 1
          description: Число обычных сезонов сериала; null для фильма или неизвестного значения
        provider: { type: string, enum: [tmdb, kinopoisk] }
        external_id: { type: integer }
        original_title: { type: string }
        runtime_min: { type: integer }
        directors:
          type: array
          description: Все известные режиссёры; пустой массив при отсутствии данных
          items: { $ref: '#/components/schemas/Director' }
        cast:
          type: array
          description: Первые 10 актёров в порядке титров; пустой массив при отсутствии данных
          items: { $ref: '#/components/schemas/CastMember' }
        genres:
          type: array
          items: { $ref: '#/components/schemas/Genre' }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster_url: { type: string, format: uri }
        rating: { type: number, format: float }
        rating_provider: { type: string, enum: [tmdb, kinopoisk] }
        rating_vote_count: { type: [integer, 'null'], minimum: 0 }

    Job:
      type: object
      required: [id, kind, status, candidates]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [reel, title] }
        status:
          type: string
          enum: [pending, processing, confirming, done, failed, cancelled]
        query_title: { type: string }
        query_year: { type: integer }
        source_url: { type: string }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
        error:
          type: string
          description: Заполняется только при status=failed
        error_code:
          type: string
          description: |
            Машинный код причины при status=failed (тот же, что в ErrorResponse.code):
            title_not_recognized — в описании рилса не нашлось названия;
            no_candidates — название есть (query_title), но каталог его не знает;
            reel_unavailable — не удалось получить описание рилса.

    ConfirmJobRequest:
      type: object
      required: [provider, external_id]
      properties:
        media_type:
          type: string
          enum: [movie, tv]
          description: Передавать из выбранного кандидата. Без типа запрос принимается только для однозначного ID.
        provider: { type: string, enum: [tmdb, kinopoisk] }
        external_id: { type: integer }

        status: { $ref: '#/components/schemas/Status' }
        user_rating: { type: integer, minimum: 0, maximum: 10, default: 0 }
        note: { type: string }
        review: { type: string, maxLength: 5000 }

    Statistics:
      type: object
      required: [total_count, want_to_watch_count, watched_count]
      properties:
        total_count: { type: integer, minimum: 0, example: 42 }
        want_to_watch_count: { type: integer, minimum: 0, example: 24 }
        watched_count: { type: integer, minimum: 0, example: 18 }

    CollectionSummary:
      type: object
      description: Статус, тип контента и жанры учитываются; q, limit и offset игнорируются. Средняя только по просмотренным с оценкой.
      required: [movie_count, rated_count, average_user_rating]
      properties:
        movie_count: { type: integer }
        rated_count: { type: integer }
        average_user_rating: { type: [number, 'null'] }

    GenreStats:
      allOf:
        - { $ref: '#/components/schemas/Genre' }
        - type: object
          required: [want_to_watch_count, watched_count]
          properties:
            want_to_watch_count: { type: integer }
            watched_count: { type: integer }
